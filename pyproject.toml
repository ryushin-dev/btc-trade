[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trade"
version = "0.1.0"
description = "bitbank BTC/JPY automated trading: backtest, paper trading, and guarded live client"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["btc_trade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
